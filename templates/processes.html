{% extends "base.html" %}

{% block content %}
<div class="container-fluid">
    <div class="row">
        <div class="col-md-4">
            <div class="card">
                <div class="card-header">
                    <h6 class="card-title">Add Process</h6>
                </div>
                <div class="card-body">
                    <form id="process-form">
                        <div class="mb-3">
                            <label class="form-label">Process Name</label>
                            <input type="text" class="form-control" id="process-name" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Arrival Time</label>
                            <input type="number" class="form-control" id="arrival-time" min="0" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Burst Time</label>
                            <input type="number" class="form-control" id="burst-time" min="1" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Priority (lower = higher)</label>
                            <input type="number" class="form-control" id="priority" value="0">
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Add Process</button>
                    </form>
                </div>
            </div>
        </div>
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h6 class="card-title">Processes</h6>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Name</th>
                                    <th>Arrival</th>
                                    <th>Burst</th>
                                    <th>Priority</th>
                                    <th>State</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="processes-table">
                                <tr>
                                    <td colspan="7" class="text-center text-muted">No processes</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/processes.js') }}"></script>
{% endblock %}
